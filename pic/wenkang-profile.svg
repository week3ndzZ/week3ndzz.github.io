<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 500" role="img" aria-labelledby="title desc">
  <title id="title">Wenkang Jiang monogram</title>
  <desc id="desc">The initials WJ over a subtle causal graph.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8eef8" />
      <stop offset="1" stop-color="#cbd9ec" />
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#527bbd" />
      <stop offset="1" stop-color="#224b8d" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#163a73" flood-opacity="0.16" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7393c3" />
    </marker>
  </defs>

  <rect width="650" height="500" fill="url(#background)" />
  <g fill="none" stroke="#7393c3" stroke-width="4" opacity="0.62" marker-end="url(#arrow)">
    <path d="M85 120C155 120 170 190 235 205" />
    <path d="M88 370C160 370 171 300 236 285" />
    <path d="M412 205C482 188 498 122 565 122" />
    <path d="M412 285C482 302 498 370 565 370" />
  </g>
  <g fill="#ffffff" stroke="#527bbd" stroke-width="5" filter="url(#shadow)">
    <circle cx="78" cy="120" r="24" />
    <circle cx="78" cy="370" r="24" />
    <circle cx="575" cy="120" r="24" />
    <circle cx="575" cy="370" r="24" />
  </g>
  <rect x="217" y="135" width="216" height="230" rx="22" fill="url(#mark)" filter="url(#shadow)" />
  <text x="325" y="278" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="103" text-anchor="middle" letter-spacing="-8">WJ</text>
  <text x="325" y="326" fill="#dbe6f5" font-family="Georgia, 'Times New Roman', serif" font-size="18" text-anchor="middle" letter-spacing="4">CAUSAL AI</text>
</svg>
